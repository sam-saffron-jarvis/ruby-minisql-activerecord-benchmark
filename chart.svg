<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">MiniSql vs ActiveRecord benchmark</title>
<desc id="desc">Grouped horizontal bar chart showing MiniSql faster than ActiveRecord in Jarvis container and wasnotwas Docker runs.</desc>
<rect width="100%" height="100%" fill="#faf8f4"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#24211d}.title{font-size:32px;font-weight:800}.sub{font-size:17px;fill:#5c554d}.label{font-size:16px}.group{font-size:21px;font-weight:800}.value{font-size:15px;font-weight:800}.axis{stroke:#ded6ca;stroke-width:1}.tick{font-size:13px;fill:#7a7570}</style>
<text x="56" y="54" class="title">MiniSql vs ActiveRecord — sessions per second</text>
<text x="56" y="86" class="sub">60 seconds per combination. Higher is better. Same benchmark, two environments.</text>
