<text x="617.1" y="766" text-anchor="middle" class="tick">200</text>
<line x1="730.7" y1="116" x2="730.7" y2="742" class="axis"/>
<text x="730.7" y="766" text-anchor="middle" class="tick">300</text>
<line x1="844.3" y1="116" x2="844.3" y2="742" class="axis"/>
<text x="844.3" y="766" text-anchor="middle" class="tick">400</text>
<line x1="957.9" y1="116" x2="957.9" y2="742" class="axis"/>
<text x="957.9" y="766" text-anchor="middle" class="tick">500</text>
<line x1="1071.4" y1="116" x2="1071.4" y2="742" class="axis"/>
<text x="1071.4" y="766" text-anchor="middle" class="tick">600</text>
<line x1="1185.0" y1="116" x2="1185.0" y2="742" class="axis"/>
<text x="1185.0" y="766" text-anchor="middle" class="tick">700</text>
