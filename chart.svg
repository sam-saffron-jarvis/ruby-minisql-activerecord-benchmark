<text x="1002.9" y="712" text-anchor="middle" class="tick">600</text>
<line x1="1110.0" y1="98" x2="1110.0" y2="688" class="axis"/>
<text x="1110.0" y="712" text-anchor="middle" class="tick">700</text>
<text x="56" y="144" class="group">Jarvis container</text>
<text x="344" y="143" text-anchor="end" class="label">Ruby 3.4.6 MiniSql</text>
