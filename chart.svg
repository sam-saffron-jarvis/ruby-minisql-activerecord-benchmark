<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">MiniSql vs ActiveRecord benchmark</title>
<desc id="desc">Grouped horizontal bar chart showing MiniSql faster than ActiveRecord after iterating and rendering each row to text.</desc>
<rect width="100%" height="100%" fill="#faf8f4"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#24211d}.title{font-size:32px;font-weight:800}.sub{font-size:17px;fill:#5c554d}.label{font-size:16px}.group{font-size:21px;font-weight:800}.value{font-size:15px;font-weight:800}.axis{stroke:#ded6ca;stroke-width:1}.tick{font-size:13px;fill:#7a7570}</style>
<text x="56" y="54" class="title">MiniSql vs ActiveRecord — rendered sessions per second</text>
<text x="56" y="86" class="sub">Each query result is iterated and converted to tab-separated text. 60 seconds per combination.</text>
<line x1="390.0" y1="116" x2="390.0" y2="742" class="axis"/>
<text x="390.0" y="766" text-anchor="middle" class="tick">0</text>
<line x1="503.6" y1="116" x2="503.6" y2="742" class="axis"/>
<text x="503.6" y="766" text-anchor="middle" class="tick">100</text>
