<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc">
<title id="title">MiniSql vs ActiveRecord with YJIT benchmark</title>
<desc id="desc">Horizontal bar chart including YJIT on and off.</desc>
<rect width="100%" height="100%" fill="#faf8f4"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#24211d}.title{font-size:32px;font-weight:800}.sub{font-size:17px;fill:#5c554d}.label{font-size:15px}.group{font-size:21px;font-weight:800}.value{font-size:14px;font-weight:800}.axis{stroke:#ded6ca;stroke-width:1}.tick{font-size:13px;fill:#7a7570}</style>
<text x="56" y="54" class="title">MiniSql vs ActiveRecord — rendered sessions per second</text>
<text x="56" y="86" class="sub">YJIT on/off. Each query result is iterated and converted to tab-separated text. 60s per combination.</text>
